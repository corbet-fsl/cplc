schema = 1
project = "cplc"

[checks.verify]
kind = "commands"
fleet = true
commands = [
  ["bash", "-c", "cargo metadata --locked --format-version 1 > dependency-metadata.json"],
  ["python3", ".ci/test-provider-controls.py"],
  ["cargo", "fmt", "--all", "--check"],
  ["ccid", "first-party"],
  ["cargo", "clippy", "--locked", "--all-targets", "--", "-D", "warnings"],
  ["python3", ".ci/provider-controls.py"],
  ["cargo", "test", "--locked", "--no-fail-fast"],
  ["ccid", "coverage", "run"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["python3", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "dependency-metadata.json"]

[coverage]
llvm_cov = ["--branch", "--ignore-filename-regex", "(^|/)(tests|scripts)/"]
report = ["--branch", "--ignore-filename-regex", "(^|/)(tests|scripts)/"]
text = ["--show-instantiations"]
artifacts = true

[[coverage.exclusions]]
file = "src/policy.rs"
line = 305
context = ["        cgts::gates::define_settings(&mut change.rulebook)", '            .map_err(|_| Error::Invalid("gate settings"))?;', "        change.rulebook.validate()?;"]
reason = "The maintained cgts catalogue installer skips an existing voucher setting and otherwise defines one fixed valid key, integer default and bounds. Its crbk validation cannot fail for these constants. Retain the defensive upstream error mapping; reassess when that owner changes the catalogue contract."
targets = ["native"]

[[coverage.exclusions]]
file = "src/policy.rs"
line = 670
context = ["                next.schema.clone().ok_or(Error::Missing)?,", "            )?,", "            SnapshotKind::SchemaVersions => {"]
reason = "The schema snapshot was already encoded and size-checked by set_schema using maximal u64 counters before durable replacement. Publication uses smaller positive signed-64-bit counters and the identical concrete schema serializer, so this second encoding cannot fail. Missing schema and the reachable settings/history size refusals remain measured."
targets = ["native"]

[[coverage.exclusions]]
file = "src/storage.rs"
line = 186
context = ["        if serde_json::to_vec(&document)", "            .map_err(|_| Error::Corrupt)?", "            .len()"]
reason = "StoredPolicy and its nested owned schema/configuration types use derived serialization with string or unit-enum JSON map keys and valid JSON numbers. No custom fallible serializer exists. This serde error mapping is defensive; encoded-size validation remains measured and allocation failure does not return a serde error."
targets = ["native"]

[[coverage.exclusions]]
file = "src/storage/sql.rs"
line = 248
context = ["                .unwrap_or_default(),", "        )?;", "        let new_entries = entries(&next.revocations)?;"]
reason = "entries serializes only concrete 32-byte device arrays and constructs owned member strings. Those serde serializers cannot fail; this old-entry conversion propagates only that impossible error. Real malformed revocation decoding and SQL write/refusal paths remain measured."
targets = ["native"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[render]
render_schema = 2

[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["verify", "advisories"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]

# Resolve once on Crow, then review and retain the lock before full verification.
[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock", "dependency-metadata.json"]

[jobs.resolve-dependencies]
scheduler = "forgejo"
runs_on = "heavy"
events = ["manual"]
checks = ["resolve-dependencies"]
workflow = "resolve"
command = ["bash", ".ci/run-cached.sh"]

[check_shell]


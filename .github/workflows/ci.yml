name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '21 4 * * 1'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh dependencies within declared ranges
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.repository }}
  cancel-in-progress: false
  queue: max
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: never
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Verify the committed dependency snapshot before refreshing
        run: |
          cargo metadata --locked --format-version 1 > dependency-metadata.json
          python3 .github/check-first-party.py
      - name: Refresh one reproducible dependency snapshot
        run: cargo update
      - name: Resolve one snapshot for every job
        run: cargo metadata --locked --format-version 1 > dependency-metadata.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: resolved-lock
          path: |
            Cargo.lock
            dependency-metadata.json
      - name: Prepare formatting correction without executing project code
        run: |
          cargo fmt --all
          git diff -- '*.rs' > rustfmt.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustfmt-patch
          path: rustfmt.patch
      - run: test ! -s rustfmt.patch
      - run: python3 .github/check-first-party.py
      - run: python3 .github/test-check-source-coverage.py
  check:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: resolved-lock
          path: .
      - run: rustc --version
      - run: cargo fmt --all --check
      - run: python3 .github/check-first-party.py
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories
  coverage:
    needs: [resolve, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          key: coverage
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-llvm-cov
      - run: rustc --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: resolved-lock
          path: .
      - name: Measure production lines and branches
        run: cargo llvm-cov --locked --branch --ignore-filename-regex '(^|/)(tests|scripts)/' --json --output-path coverage.json
      - name: Retain source and instantiation diagnostics from the same execution
        run: |
          cargo llvm-cov report --branch --ignore-filename-regex '(^|/)(tests|scripts)/' --lcov --output-path coverage.lcov
          cargo llvm-cov report --branch --ignore-filename-regex '(^|/)(tests|scripts)/' --text --show-instantiations --output-path coverage.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage
          path: |
            coverage.json
            coverage.lcov
            coverage.txt
      - run: python3 .github/check-source-coverage.py coverage.lcov coverage.json coverage.txt

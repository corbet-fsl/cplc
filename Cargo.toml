[package]
name = "cplc"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Policy facade of cvld: rulebook, profile schema and signing"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-fsl/cplc.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[dependencies]
cvch = { git = "https://git.corbet.ch/corbet-libre/cvch.git", branch = "main" }
cblc = { git = "https://git.corbet.ch/corbet-fsl/cblc.git", branch = "main", features = ["publication"] }
ckyh = { git = "https://git.corbet.ch/corbet-libre/ckyh.git", branch = "main" }
cbcn = { git = "https://git.corbet.ch/corbet-libre/cbcn.git", branch = "main" }
cpsd = { git = "https://git.corbet.ch/corbet-libre/cpsd.git", branch = "main" }
cgts = { git = "https://git.corbet.ch/corbet-fsl/cgts.git", branch = "main" }
crbk = { git = "https://git.corbet.ch/corbet-libre/crbk.git", branch = "main" }
cblv = { git = "https://git.corbet.ch/corbet-libre/cblv.git", branch = "main" }
crlt = { git = "https://git.corbet.ch/corbet-libre/crlt.git", branch = "main" }
csgn = { git = "https://git.corbet.ch/corbet-libre/csgn.git", branch = "main", features = ["libsql"] }
cshm = { git = "https://git.corbet.ch/corbet-libre/cshm.git", branch = "main" }
data-encoding = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
ohttp = { version = "0.8", default-features = false, features = ["rust-hpke"] }
sha2 = "0.10"
webauthn-rs-proto = "0.5.5"
cpky = { git = "https://git.corbet.ch/corbet-libre/cpky.git", branch = "main", features = ["test-authenticator"] }
libsql = { version = "0.9", default-features = false, features = ["core"] }
clbs = { git = "https://git.corbet.ch/corbet-libre/clbs.git", branch = "main" }
rand = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
